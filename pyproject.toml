[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-continuum-normalization"
version = "0.1.0"
description = "Constrained stellar and telluric absorption models for continuum normalization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "astropy>=8.0.2",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
    "threadpoolctl>=3.6.0",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
